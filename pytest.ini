[pytest]
# 测试用例目录
testpaths = testcases

# 默认参数：
#   --alluredir  allure 原始结果输出目录（与日志分离）
#   --clean-alluredir 每次清空 allure 结果
#   -s           打印 print 输出
#   -v           详细
#   --self-contained-html 不需要时可用
addopts =
    -sv
    --alluredir=reports/allure-results
    --clean-alluredir

# 自定义 mark（已在 conftest 注册，这里做 --strict-markers 校验）
markers =
    smoke: 冒烟用例
    P0: 最高优先级（阻塞级）
    P1: 高优先级
    P2: 中优先级
    P3: 低优先级
    regression: 回归用例
    flaky: 不稳定用例（失败重试）

# 日志（pytest 自带 log，与 loguru 互不冲突，留作插件兼容）
log_cli = false
